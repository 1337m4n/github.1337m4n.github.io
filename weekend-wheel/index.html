<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2ef">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>周末去哪儿</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#eef2ef;color:#255f54;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#317b6c;animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.25;transform:scale(.75)}}</style>
</head>
<body><div class="loading"><span class="dot"></span><div style="margin-top:12px">正在打开转盘…</div></div>
<script>
(async()=>{
  const BUILD="20260820-1055";
  const parts=[
    "./chunks/part-00.txt?b="+BUILD,
    "./chunks/part-01.txt?b="+BUILD,
    "./chunks/part-02.txt?b="+BUILD,
    "./chunks/part-03.txt?b="+BUILD,
    "./chunks/part-04.txt?b="+BUILD,
    "./chunks/part-05.txt?b="+BUILD,
    "./chunks/part-06.txt?b="+BUILD
  ];

  try{
    const texts=await Promise.all(
      parts.map(p=>fetch(p,{cache:"no-store"}).then(r=>{
        if(!r.ok) throw new Error(p);
        return r.text();
      }))
    );

    let app=texts.join("");

    app=app.replace(
      '<div class="helper">文字会随停靠位置自动翻正；右侧同色细针精确标记最终落点。</div>',
      ''
    );

    app=app.replace(
      /<script>\s*if\s*\("serviceWorker"\s+in\s+navigator[\s\S]*?navigator\.serviceWorker\.register\("\.\/sw\.js"\)[\s\S]*?<\/script>/g,
      ''
    );

    app=app.replace(
      '<script src="./sync.js"></'+'script>',
      '<script src="./sync.js?b='+BUILD+'"></'+'script>'
    );

    const manualSpinCore=String.raw`
var manualSpinPhase="idle";
var manualSpinRaf=0;
var manualLastTime=0;
var manualVelocity=0;
var manualTargetVelocity=760;
var manualBrakeDuration=520;
var progressSlot=0;
var COMPLETED_PREFIX="weekendWheelCompletedV3:";

if(noRepeatEl) noRepeatEl.checked=true;

function updateRemain(){
  remainEl.textContent="剩余 "+active.length+" 个候选";
  spinBtn.disabled=active.length===0 || manualSpinPhase==="stopping";
  if(active.length===0){
    spinBtn.textContent="完成";
  }else if(manualSpinPhase==="spinning"){
    spinBtn.textContent="停止";
  }else if(manualSpinPhase==="stopping"){
    spinBtn.textContent="减速中";
  }else{
    spinBtn.textContent="开始";
  }
}

function setRotorVisualOnly(deg){
  rotor.style.transform="rotate("+deg+"deg)";
}

function itemKeyForIndex(idx){
  idx=parseInt(idx,10);
  if(!(idx>=0&&idx<items.length)) return "";
  var text=String(items[idx]);
  var occurrence=0;
  for(var i=0;i<=idx;i++) if(String(items[i])===text) occurrence++;
  return text+"\u241e"+occurrence;
}

function indexForItemKey(key){
  key=String(key||"");
  for(var i=0;i<items.length;i++) if(itemKeyForIndex(i)===key) return i;
  return -1;
}

function describeIndex(idx){
  idx=parseInt(idx,10);
  if(!(idx>=0&&idx<items.length)) return null;
  return {index:idx,key:itemKeyForIndex(idx),text:String(items[idx]||"")};
}

function listFingerprint(){
  var raw=items.map(function(x,i){return i+":"+String(x);}).join("\u241f");
  var h=2166136261;
  for(var i=0;i<raw.length;i++){
    h^=raw.charCodeAt(i);
    h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);
  }
  return (h>>>0).toString(36);
}

function progressKey(){
  var slot=parseInt(progressSlot||window.WeekendWheelActiveSlot,10);
  if(slot>=1&&slot<=3) return COMPLETED_PREFIX+"slot-"+slot;
  return COMPLETED_PREFIX+"list-"+listFingerprint();
}

function normalizeCompletedRows(saved){
  if(!Array.isArray(saved)) return [];
  var seen={};
  var out=[];
  saved.forEach(function(row){
    var idx=-1;
    if(row&&typeof row==="object"&&row.key) idx=indexForItemKey(row.key);
    if(idx<0){
      idx=typeof row==="number"?row:parseInt(row&&row.index,10);
      var text=typeof row==="number"?(items[idx]||""):String(row&&row.text!=null?row.text:"");
      if(!(idx>=0&&idx<items.length)||items[idx]!==text) return;
    }
    if(seen[idx]) return;
    seen[idx]=true;
    out.push(idx);
  });
  return out;
}

function loadCompleted(){
  var raw="";
  try{raw=localStorage.getItem(progressKey())||"";}catch(e){return [];}
  if(!raw) return [];
  try{return normalizeCompletedRows(JSON.parse(raw));}catch(e){return [];}
}

function persistCompleted(){
  var rows=history.map(function(idx){
    var d=describeIndex(idx);
    return d?{key:d.key,index:d.index,text:d.text}:null;
  }).filter(Boolean);
  try{localStorage.setItem(progressKey(),JSON.stringify(rows));}catch(e){}
}

function rebuildFromCompleted(){
  history=loadCompleted();
  var done={};
  history.forEach(function(idx){done[idx]=true;});
  active=items.map(function(_,i){return i;}).filter(function(i){return !done[i];});
}

function renderProgressState(){
  angle=0;
  lastTickSector=-1;
  setRotorAngle(0);
  buildWheel();
  resultEl.textContent=history.length?(items[history[history.length-1]]||"已完成项目"):"等你开始";
  renderHistory();
  updateRemain();
}

function resetRound(clearProgress){
  if(manualSpinRaf) cancelAnimationFrame(manualSpinRaf);
  manualSpinRaf=0;
  manualSpinPhase="idle";
  manualLastTime=0;
  manualVelocity=0;
  spinning=false;
  rotor.classList.remove("is-spinning");

  if(clearProgress){
    history=[];
    active=items.map(function(_,i){return i;});
    persistCompleted();
  }else{
    rebuildFromCompleted();
  }
  renderProgressState();
}

function applySharedCompleted(rows){
  if(manualSpinPhase!=="idle") return false;
  history=normalizeCompletedRows(rows);
  var done={};
  history.forEach(function(idx){done[idx]=true;});
  active=items.map(function(_,i){return i;}).filter(function(i){return !done[i];});
  persistCompleted();
  renderProgressState();
  return true;
}

function bumpPointer(){
  if(!pointerAssembly) return;
  pointerAssembly.classList.remove("bump");
  void pointerAssembly.offsetWidth;
  pointerAssembly.classList.add("bump");
}

function tickForAngle(current){
  if(active.length===0) return;
  var slice=360/active.length;
  var sector=Math.floor(normalize(current)/slice);
  if(sector!==lastTickSector){
    if(lastTickSector!==-1) bumpPointer();
    lastTickSector=sector;
  }
}

function chosenPositionAtPointer(current){
  var n=active.length;
  if(!n) return -1;
  var slice=360/n;
  var localAngle=normalize(90-current);
  return Math.floor((localAngle+slice/2)/slice)%n;
}

function markCompletedIndex(idx){
  if(manualSpinPhase!=="idle") return false;
  idx=parseInt(idx,10);
  if(!(idx>=0&&idx<items.length)) return false;
  if(active.indexOf(idx)===-1) return false;
  history=history.filter(function(x){return x!==idx;});
  history.push(idx);
  active=active.filter(function(x){return x!==idx;});
  persistCompleted();
  renderProgressState();
  return true;
}

function restoreCompletedIndex(idx){
  if(manualSpinPhase!=="idle") return false;
  idx=parseInt(idx,10);
  if(!(idx>=0&&idx<items.length)) return false;
  if(history.indexOf(idx)===-1) return false;
  history=history.filter(function(x){return x!==idx;});
  if(active.indexOf(idx)===-1){active.push(idx);active.sort(function(a,b){return a-b;});}
  persistCompleted();
  renderProgressState();
  return true;
}

function restoreLastCompleted(){
  if(!history.length) return false;
  return restoreCompletedIndex(history[history.length-1]);
}

function clearCompleted(){
  if(manualSpinPhase!=="idle") return false;
  history=[];
  active=items.map(function(_,i){return i;});
  persistCompleted();
  renderProgressState();
  return true;
}

function finishManualSpin(){
  manualSpinPhase="idle";
  spinning=false;
  rotor.classList.remove("is-spinning");
  angle=normalize(angle);
  setRotorAngle(angle);

  var chosenPos=chosenPositionAtPointer(angle);
  if(chosenPos<0){updateRemain();return;}

  var chosenIdx=active[chosenPos];
  history=history.filter(function(idx){return idx!==chosenIdx;});
  history.push(chosenIdx);
  resultEl.textContent=items[chosenIdx];
  active=active.filter(function(idx){return idx!==chosenIdx;});
  persistCompleted();

  angle=0;
  lastTickSector=-1;
  setRotorAngle(0);
  buildWheel();
  renderHistory();
  updateRemain();

  if(window.WeekendWheelSharedProgress&&typeof window.WeekendWheelSharedProgress.addCompletedByIndex==="function"){
    window.WeekendWheelSharedProgress.addCompletedByIndex(chosenIdx,true);
  }
}

function startManualSpin(){
  if(active.length===0 || manualSpinPhase!=="idle") return;
  spinning=true;
  manualSpinPhase="spinning";
  manualLastTime=0;
  manualVelocity=0;
  lastTickSector=-1;
  rotor.classList.add("is-spinning");
  updateRemain();

  function run(ts){
    if(manualSpinPhase!=="spinning") return;
    if(!manualLastTime) manualLastTime=ts;
    var dt=Math.min(.04,(ts-manualLastTime)/1000);
    manualLastTime=ts;
    manualVelocity+=(manualTargetVelocity-manualVelocity)*Math.min(1,dt*4.8);
    angle+=manualVelocity*dt;
    setRotorVisualOnly(angle);
    tickForAngle(angle);
    manualSpinRaf=requestAnimationFrame(run);
  }
  manualSpinRaf=requestAnimationFrame(run);
}

function stopManualSpin(){
  if(manualSpinPhase!=="spinning") return;
  manualSpinPhase="stopping";
  if(manualSpinRaf) cancelAnimationFrame(manualSpinRaf);
  manualSpinRaf=0;
  updateRemain();

  var startTime=performance.now();
  var startAngle=angle;
  var startVelocity=manualVelocity;
  var duration=manualBrakeDuration;
  var totalDistance=startVelocity*(duration/1000)/3;

  function brake(ts){
    var t=Math.min(1,(ts-startTime)/duration);
    var p=1-Math.pow(1-t,3);
    angle=startAngle+totalDistance*p;
    setRotorVisualOnly(angle);
    tickForAngle(angle);
    if(t<1){manualSpinRaf=requestAnimationFrame(brake);return;}
    manualSpinRaf=0;
    manualVelocity=0;
    finishManualSpin();
  }
  manualSpinRaf=requestAnimationFrame(brake);
}

function spin(){
  if(active.length===0) return;
  if(manualSpinPhase==="idle") startManualSpin();
  else if(manualSpinPhase==="spinning") stopManualSpin();
}

window.WeekendWheelRuntime={
  isBusy:function(){return manualSpinPhase==="spinning"||manualSpinPhase==="stopping";},
  setProfileSlot:function(slotNo){
    slotNo=parseInt(slotNo,10);
    progressSlot=(slotNo>=1&&slotNo<=3)?slotNo:0;
    if(progressSlot) window.WeekendWheelActiveSlot=progressSlot;
    return progressSlot;
  },
  describeIndex:function(idx){return describeIndex(idx);},
  getCompleted:function(){return history.map(function(idx){return describeIndex(idx);}).filter(Boolean);},
  getRemaining:function(){return active.map(function(idx){return describeIndex(idx);}).filter(Boolean);},
  markCompleted:function(idx){return markCompletedIndex(idx);},
  restoreCompleted:function(idx){return restoreCompletedIndex(idx);},
  restoreLastCompleted:function(){return restoreLastCompleted();},
  clearCompleted:function(){return clearCompleted();},
  reloadCompleted:function(){if(manualSpinPhase!=="idle")return false;resetRound(false);return true;},
  applySharedCompleted:function(rows){return applySharedCompleted(rows);}
};

spinBtn.addEventListener("click",spin);`;

    const spinCorePattern=/function updateRemain\(\)\{[\s\S]*?spinBtn\.addEventListener\("click",spin\);/;
    if(!spinCorePattern.test(app)) throw new Error("manual spin patch target missing");
    app=app.replace(spinCorePattern,manualSpinCore);

    const extras=[
      "./admin.js?b="+BUILD,
      "./mobile-guard.js?b="+BUILD,
      "./wheel-fix.js?b="+BUILD,
      "./mechanical-motion.js?b="+BUILD,
      "./sw-register.js?b="+BUILD,
      "./profile-manager.js?b="+BUILD,
      "./shared-progress.js?b="+BUILD,
      "./achievements.js?b="+BUILD
    ];
    const extraTags=extras.map(src=>'<script src="'+src+'"></'+'script>').join("");

    if(app.includes("</body>")) app=app.replace("</body>",extraTags+"</body>");
    else app+=extraTags;

    document.open();
    document.write(app);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">转盘加载失败，请刷新重试。</div>';
  }
})();
</script>
</body>
</html>
