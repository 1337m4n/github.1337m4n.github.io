<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2ef">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>周末去哪儿</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#eef2ef;color:#255f54;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#317b6c;animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.25;transform:scale(.75)}}</style>
</head>
<body><div class="loading"><span class="dot"></span><div style="margin-top:12px">正在打开转盘…</div></div>
<script>
(async()=>{
  const BUILD="20260811-2226";
  const parts=[
    "./chunks/part-00.txt?b="+BUILD,
    "./chunks/part-01.txt?b="+BUILD,
    "./chunks/part-02.txt?b="+BUILD,
    "./chunks/part-03.txt?b="+BUILD,
    "./chunks/part-04.txt?b="+BUILD,
    "./chunks/part-05.txt?b="+BUILD,
    "./chunks/part-06.txt?b="+BUILD
  ];

  try{
    const texts=await Promise.all(
      parts.map(p=>fetch(p,{cache:"no-store"}).then(r=>{
        if(!r.ok) throw new Error(p);
        return r.text();
      }))
    );

    let app=texts.join("");

    /* 在页面组装阶段直接删除旧说明，不再依赖增强脚本执行后才移除。 */
    app=app.replace(
      '<div class="helper">文字会随停靠位置自动翻正；右侧同色细针精确标记最终落点。</div>',
      ''
    );

    const extras=[
      "./admin.js?b="+BUILD,
      "./mobile-guard.js?b="+BUILD,
      "./wheel-fix.js?b="+BUILD,
      "./mechanical-motion.js?b="+BUILD
    ];
    const extraTags=extras.map(src=>'<script src="'+src+'"></'+'script>').join("");

    if(app.includes("</body>")){
      app=app.replace("</body>",extraTags+"</body>");
    }else{
      app+=extraTags;
    }

    document.open();
    document.write(app);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">转盘加载失败，请刷新重试。</div>';
  }
})();
</script>
</body>
</html>
