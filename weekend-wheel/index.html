<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2ef">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>周末去哪儿</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#eef2ef;color:#255f54;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#317b6c;animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.25;transform:scale(.75)}}</style>
</head>
<body><div class="loading"><span class="dot"></span><div style="margin-top:12px">正在打开转盘…</div></div>
<script>
(async()=>{
  const BUILD="20260812-0900";
  const parts=[
    "./chunks/part-00.txt?b="+BUILD,
    "./chunks/part-01.txt?b="+BUILD,
    "./chunks/part-02.txt?b="+BUILD,
    "./chunks/part-03.txt?b="+BUILD,
    "./chunks/part-04.txt?b="+BUILD,
    "./chunks/part-05.txt?b="+BUILD,
    "./chunks/part-06.txt?b="+BUILD
  ];

  try{
    const texts=await Promise.all(
      parts.map(p=>fetch(p,{cache:"no-store"}).then(r=>{
        if(!r.ok) throw new Error(p);
        return r.text();
      }))
    );

    let app=texts.join("");

    /* 直接删除旧说明文字。 */
    app=app.replace(
      '<div class="helper">文字会随停靠位置自动翻正；右侧同色细针精确标记最终落点。</div>',
      ''
    );

    /*
      旧版分片自身会再次注册 ./sw.js。
      这里把那段内联注册完整剔除，只保留 sw-register.js 这一条注册链，
      避免 Safari 在用户首次点击时发生双重注册 / 接管竞争。
    */
    app=app.replace(
      /<script>\s*if\s*\("serviceWorker"\s+in\s+navigator[\s\S]*?navigator\.serviceWorker\.register\("\.\/sw\.js"\)[\s\S]*?<\/script>/g,
      ''
    );

    /*
      手动启停模式：
      第一次点击开始持续旋转；第二次点击才触发刹车。
      最终扇区只由停止时机 + 固定惯性决定，不预先随机选择结果。
    */
    const manualSpinCore=String.raw`
var manualSpinPhase="idle";
var manualSpinRaf=0;
var manualLastTime=0;
var manualVelocity=0;
var manualTargetVelocity=760;
var manualBrakeDuration=520;

function updateRemain(){
  remainEl.textContent="当前 "+active.length+" 个候选";
  spinBtn.disabled=active.length===0 || manualSpinPhase==="stopping";
  if(active.length===0){
    spinBtn.textContent="完成";
  }else if(manualSpinPhase==="spinning"){
    spinBtn.textContent="停止";
  }else if(manualSpinPhase==="stopping"){
    spinBtn.textContent="减速中";
  }else{
    spinBtn.textContent="开始";
  }
}

function resetRound(){
  if(manualSpinRaf) cancelAnimationFrame(manualSpinRaf);
  manualSpinRaf=0;
  manualSpinPhase="idle";
  manualLastTime=0;
  manualVelocity=0;
  active=items.map(function(_,i){return i;});
  history=[];
  spinning=false;
  rotor.classList.remove("is-spinning");
  angle=0;
  lastTickSector=-1;
  setRotorAngle(0);
  resultEl.textContent="等你开始";
  buildWheel();
  renderHistory();
  updateRemain();
}

function bumpPointer(){
  if(!pointerAssembly) return;
  pointerAssembly.classList.remove("bump");
  void pointerAssembly.offsetWidth;
  pointerAssembly.classList.add("bump");
}

function tickForAngle(current){
  if(active.length===0) return;
  var slice=360/active.length;
  var sector=Math.floor(normalize(current)/slice);
  if(sector!==lastTickSector){
    if(lastTickSector!==-1) bumpPointer();
    lastTickSector=sector;
  }
}

function chosenPositionAtPointer(current){
  var n=active.length;
  if(!n) return -1;
  var slice=360/n;
  var localAngle=normalize(90-current);
  return Math.floor((localAngle+slice/2)/slice)%n;
}

function finishManualSpin(){
  manualSpinPhase="idle";
  spinning=false;
  rotor.classList.remove("is-spinning");
  angle=normalize(angle);
  setRotorAngle(angle);

  var chosenPos=chosenPositionAtPointer(angle);
  if(chosenPos<0){
    updateRemain();
    return;
  }

  var chosenIdx=active[chosenPos];
  history.push(chosenIdx);
  resultEl.textContent=items[chosenIdx];

  if(noRepeatEl.checked){
    active=active.filter(function(idx){return idx!==chosenIdx;});
    angle=0;
    setRotorAngle(0);
    buildWheel();
  }

  renderHistory();
  updateRemain();
}

function startManualSpin(){
  if(active.length===0 || manualSpinPhase!=="idle") return;

  spinning=true;
  manualSpinPhase="spinning";
  manualLastTime=0;
  manualVelocity=0;
  lastTickSector=-1;
  rotor.classList.add("is-spinning");
  resultEl.textContent="转动中，点停止决定落点";
  updateRemain();

  function run(ts){
    if(manualSpinPhase!=="spinning") return;
    if(!manualLastTime) manualLastTime=ts;

    var dt=Math.min(.04,(ts-manualLastTime)/1000);
    manualLastTime=ts;

    manualVelocity+=(manualTargetVelocity-manualVelocity)*Math.min(1,dt*4.8);
    angle+=manualVelocity*dt;
    setRotorAngle(angle);
    tickForAngle(angle);

    manualSpinRaf=requestAnimationFrame(run);
  }

  manualSpinRaf=requestAnimationFrame(run);
}

function stopManualSpin(){
  if(manualSpinPhase!=="spinning") return;

  manualSpinPhase="stopping";
  if(manualSpinRaf) cancelAnimationFrame(manualSpinRaf);
  manualSpinRaf=0;
  updateRemain();

  var startTime=performance.now();
  var startAngle=angle;
  var startVelocity=manualVelocity;
  var duration=manualBrakeDuration;
  var totalDistance=startVelocity*(duration/1000)/3;

  function brake(ts){
    var t=Math.min(1,(ts-startTime)/duration);
    var p=1-Math.pow(1-t,3);
    angle=startAngle+totalDistance*p;
    setRotorAngle(angle);
    tickForAngle(angle);

    if(t<1){
      manualSpinRaf=requestAnimationFrame(brake);
      return;
    }

    manualSpinRaf=0;
    manualVelocity=0;
    finishManualSpin();
  }

  manualSpinRaf=requestAnimationFrame(brake);
}

function spin(){
  if(active.length===0) return;
  if(manualSpinPhase==="idle"){
    startManualSpin();
  }else if(manualSpinPhase==="spinning"){
    stopManualSpin();
  }
}

spinBtn.addEventListener("click",spin);`;

    const spinCorePattern=/function updateRemain\(\)\{[\s\S]*?spinBtn\.addEventListener\("click",spin\);/;
    if(!spinCorePattern.test(app)) throw new Error("manual spin patch target missing");
    app=app.replace(spinCorePattern,manualSpinCore);

    const extras=[
      "./admin.js?b="+BUILD,
      "./mobile-guard.js?b="+BUILD,
      "./wheel-fix.js?b="+BUILD,
      "./mechanical-motion.js?b="+BUILD,
      "./sw-register.js?b="+BUILD
    ];
    const extraTags=extras.map(src=>'<script src="'+src+'"></'+'script>').join("");

    if(app.includes("</body>")){
      app=app.replace("</body>",extraTags+"</body>");
    }else{
      app+=extraTags;
    }

    document.open();
    document.write(app);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">转盘加载失败，请刷新重试。</div>';
  }
})();
</script>
</body>
</html>
